[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivepin"
version = "1.0.0"
description = "One Hive R0: immutable git pinning - mint, verify, and materialize path@commit references"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "One Hive" }]
keywords = ["git", "pinning", "provenance", "content-addressing", "one-hive", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
hive-pin = "hivepin.cli:main"

[project.urls]
Homepage = "https://github.com/one-hive/hivepin"
Specification = "https://github.com/one-hive/hivepin/blob/main/SPEC.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hivepin"]

[tool.hatch.build.targets.sdist]
include = ["src/hivepin", "schemas", "SPEC.md", "README.md", "LICENSE", "docs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
